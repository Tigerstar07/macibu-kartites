<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a1f" />
    <title>Mācību kartītes · Ranked</title>
    <script>
      try {
        var s = localStorage.getItem('rrv-ranked-v1');
        if (s && JSON.parse(s).state?.settings?.darkMode) {
          document.documentElement.classList.add('dark');
        } else if (!s && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="fx-layer" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
